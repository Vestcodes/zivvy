      <text x="16" y="26" fill="#6ee7b7" font-size="10" font-weight="700" letter-spacing="1.4">SINGLE TENANT · SEAT-BASED</text>
      <g transform="translate(16,42)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#d1fae5">
        <text y="0">POST /webhooks · invoice.settled → 200 OK</text>
        <text y="18">POST /webhooks · stock.reserved → 200 OK</text>
      </g>
    </g>
    <g transform="translate(24,188)">
      <g>
        <rect width="132" height="86" rx="10" fill="rgba(6,78,59,0.6)" stroke="rgba(52,211,153,0.4)"/>
        <text x="12" y="24" fill="#6ee7b7" font-size="10" font-weight="700" letter-spacing="1">SALES</text>
        <text x="12" y="44" fill="#a7f3d0" font-size="11">/quotes · /orders</text>
        <text x="12" y="64" fill="#a7f3d0" font-size="11">quote.won</text>
      </g>
      <g transform="translate(144,0)">
        <rect width="132" height="86" rx="10" fill="rgba(6,78,59,0.6)" stroke="rgba(52,211,153,0.4)"/>
        <text x="12" y="24" fill="#6ee7b7" font-size="10" font-weight="700" letter-spacing="1">FINANCE</text>
        <text x="12" y="44" fill="#a7f3d0" font-size="11">/invoices · /payments</text>
        <text x="12" y="64" fill="#a7f3d0" font-size="11">invoice.settled</text>
      </g>
      <g transform="translate(288,0)">
        <rect width="132" height="86" rx="10" fill="rgba(6,78,59,0.6)" stroke="rgba(52,211,153,0.4)"/>
        <text x="12" y="24" fill="#6ee7b7" font-size="10" font-weight="700" letter-spacing="1">STOCK</text>
        <text x="12" y="44" fill="#a7f3d0" font-size="11">/items · /transfers</text>
        <text x="12" y="64" fill="#a7f3d0" font-size="11">stock.moved</text>
      </g>
      <g transform="translate(432,0)">
        <rect width="120" height="86" rx="10" fill="rgba(6,78,59,0.6)" stroke="rgba(52,211,153,0.4)"/>
        <text x="12" y="24" fill="#6ee7b7" font-size="10" font-weight="700" letter-spacing="1">HR &amp; OPS</text>
        <text x="12" y="44" fill="#a7f3d0" font-size="11">/employees</text>
        <text x="12" y="64" fill="#a7f3d0" font-size="11">work.order.*</text>

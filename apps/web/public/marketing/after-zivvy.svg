      <text x="220" y="52" fill="#34d399" font-size="22" font-weight="700">3 days</text>
      <text x="400" y="26" fill="#a7f3d0" font-size="11" font-weight="600">Auth models</text>
      <text x="400" y="52" fill="#34d399" font-size="22" font-weight="700">1</text>

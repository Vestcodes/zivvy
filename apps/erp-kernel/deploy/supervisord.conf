[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gunicorn]
directory=/home/frappe/frappe-bench
# Bind loopback only — public traffic enters via nginx on $PORT.
# Wrapper exports SITES_PATH=sites (frappe.app defaults to "." → IncorrectSitePath).
command=/run-gunicorn.sh
user=frappe
environment=SITES_PATH="sites",HOME="/home/frappe",USER="frappe"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/bash -c "envsubst '$$PORT $$FRAPPE_SITE_NAME' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -g 'daemon off;' -c /tmp/nginx.conf"
user=root
environment=PORT="%(ENV_PORT)s",FRAPPE_SITE_NAME="%(ENV_FRAPPE_SITE_NAME)s"
autostart=true
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/home/frappe/frappe-bench
command=bench worker --queue short,default,long
user=frappe
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schedule]
directory=/home/frappe/frappe-bench
command=bench schedule
user=frappe
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socketio]
directory=/home/frappe/frappe-bench
# Frappe's socket.io Node.js server — powers Desk realtime
# notifications. Listens on 9000 (Frappe default); nginx proxies /socket.io
# to this port. Requires redis_socketio in common_site_config.json.
command=node apps/frappe/socketio.js
user=frappe
environment=NODE_ENV="production",HOME="/home/frappe",USER="frappe"
autostart=true
autorestart=true
priority=25
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - web
          - api
          - erp-kernel

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'web' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping web deploy because Vercel secrets are not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        if: steps.secrets.outputs.configured == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/web
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  api:
    name: Deploy API to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'api' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping API deploy because Vercel secrets are not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        if: steps.secrets.outputs.configured == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/api
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  erp-kernel:
    name: Deploy ERP Kernel to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'erp-kernel' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE_ERP_KERNEL }}

    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ERP kernel deploy because Railway secrets are not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        if: steps.secrets.outputs.configured == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Deploy
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/erp-kernel
        run: pnpm dlx @railway/cli@latest up --detach --service "$RAILWAY_SERVICE"

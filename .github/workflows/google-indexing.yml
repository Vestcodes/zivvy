name: Google Indexing

on:
  push:
    branches: [main]
    paths:
      - "apps/web/app/**"
      - "apps/web/components/site/**"
      - "apps/web/lib/**"
      - "apps/web/public/**"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    name: Submit Changed URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SA_CREDENTIALS: ${{ secrets.GOOGLE_SA_CREDENTIALS }}

    steps:
      - name: Check secret
        id: secrets
        run: |
          if [ -z "$GOOGLE_SA_CREDENTIALS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping indexing because GOOGLE_SA_CREDENTIALS is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pip install PyJWT cryptography

      - name: Restore previous sitemap cache
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .sitemap-cache.json
          key: sitemap-snapshot

      - name: Submit changed URLs
        if: steps.secrets.outputs.configured == 'true'
        run: python apps/web/.github/scripts/google-indexing.py

      - name: Save sitemap cache
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache/save@v4
        with:
          path: .sitemap-cache.json
          key: sitemap-snapshot-${{ github.run_id }}

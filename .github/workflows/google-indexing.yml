name: Google Indexing API

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyJWT cryptography

      - name: Restore previous sitemap cache
        uses: actions/cache/restore@v4
        with:
          path: .sitemap-cache.json
          key: sitemap-snapshot

      - name: Submit changed URLs to Google Indexing API
        env:
          GOOGLE_SA_CREDENTIALS: ${{ secrets.GOOGLE_SA_CREDENTIALS }}
        run: python .github/scripts/google-indexing.py

      - name: Save sitemap cache
        uses: actions/cache/save@v4
        with:
          path: .sitemap-cache.json
          key: sitemap-snapshot-${{ github.run_id }}
